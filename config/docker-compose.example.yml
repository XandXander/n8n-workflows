# Пример docker-compose.yml для OSINT Platform
# НЕ ИСПОЛЬЗУЙТЕ в production без замены <REDACTED> на реальные значения!

version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=xandai.ru
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_ENCRYPTION_KEY=<REDACTED>
      - N8N_API_ENABLED=true
      - N8N_BINARY_DATA_MODE=filesystem
      - N8N_EXECUTION_MODE=regular
      - N8N_SAVE_EXECUTION_SUCCESS=none
      - N8N_SAVE_EXECUTION_FAILED=all
      - N8N_MAX_CONCURRENT_EXECUTIONS=5
      - N8N_PAYLOAD_SIZE_MAX=32
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=<REDACTED>
      - N8N_EXECUTIONS_DATA_PRUNE=true
      - N8N_EXECUTIONS_DATA_MAX_AGE=336
      - QUEUE_BULL_REDIS_HOST=redis
      - N8N_WEBHOOK_URL=https://xandai.ru
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      - postgres
      - redis

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-worker
    restart: unless-stopped
    command: worker
    environment:
      - N8N_ENCRYPTION_KEY=<REDACTED>
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=<REDACTED>
      - QUEUE_BULL_REDIS_HOST=redis
      - N8N_BINARY_DATA_MODE=filesystem
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=<REDACTED>
      - POSTGRES_DB=n8n
    volumes:
      - db_storage:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_storage:/data

  traefik:
    image: traefik:3.6.5
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/letsencrypt
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=<REDACTED>"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped

volumes:
  n8n_storage:
  db_storage:
  redis_storage:
  traefik_data:
